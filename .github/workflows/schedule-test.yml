name: Scheduled trigger test
on:
  schedule:
    - cron: '27 14 4 11 *'
      timezone: Asia/Shanghai
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify automatic scheduled trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$EVENT_NAME" = "schedule"
          echo "Automatic scheduled trigger verified"
          TZ=Asia/Shanghai date
      - name: Send authorized test notification
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          if datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%Y-%m-%d") != "2026-11-04":
              raise RuntimeError("Test expired")
          key = os.environ.get("BARK_KEY", "").strip()
          if not key:
              raise RuntimeError("BARK_KEY missing")
          payload = {"device_key": key, "title": "DailyBrief 定时触发测试", "body": "GitHub 已自动定时触发，通知发送测试成功。", "group": "DailyBrief"}
          req = urllib.request.Request("https://api.day.app/push", data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)
          if result.get("code") != 200:
              raise RuntimeError(result.get("message", "Bark failed"))
          print("Bark notification sent successfully")
          PY
